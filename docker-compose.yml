# SelfHost Dashboard - Docker Compose
#
# Quick start:
#   1. Copy .env.docker.example to .env.docker and edit values
#   2. Run: docker compose up -d
#   3. Open http://localhost:3000
#
# network_mode: host is required for Wake-on-LAN (UDP broadcast) and ICMP ping.
# The app will be available on http://<your-ip>:3000 directly.

services:
  selfhost-dashboard:
    build: .
    image: selfhost-dashboard:latest
    container_name: selfhost-dashboard
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      # Persist the SQLite database locally
      - ./data:/data
      # Optional: mount your SSH private key for key-based authentication
      # Use an absolute path — ~ may not expand correctly with sudo
      - ~/.ssh/id_ed25519:/app/ssh_key:ro
    # Required for Wake-on-LAN (UDP broadcast) and ICMP ping
    network_mode: host
